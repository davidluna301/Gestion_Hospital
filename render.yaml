# Blueprint Render — rama develop del repositorio GitHub.
# https://github.com/davidluna301/Gestion_Hospital
services:
  - type: web
    name: consultamed
    runtime: python
    plan: free
    branch: develop
    buildCommand: >-
      pip install -r requirements.txt
      && python manage.py collectstatic --noinput
      && python manage.py migrate --noinput
      && python manage.py seed_demo
    startCommand: gunicorn hospital_gestion.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: consultamed-db
          property: connectionString

databases:
  - name: consultamed-db
    plan: free
    databaseName: consultamed
    user: consultamed
